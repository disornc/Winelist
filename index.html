
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grapey Winelist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #F0EBF8;
  --cream-dark: #E0D4F0;
  --ink: #1C1A17;
  --ink-soft: #4A4640;
  --ink-muted: #8C867E;
  --red: #7A1F1F;
  --red-light: #F3E5E5;
  --white-wine: #E8E2C8;
  --white-wine-light: #FAF7EC;
  --orange-wine: #C97B2A;
  --orange-wine-light: #FBF0DC;
  --sparkling: #3B6627;
  --sparkling-light: #EBF3E4;
  --border: rgba(28,26,23,0.12);
  --radius: 12px;
  --radius-sm: 6px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* Header */
header {
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: var(--ink);
  text-transform: uppercase;
}

.logo em {
  font-style: italic;
  color: #5C2D6E;
}

.header-count {
  font-size: 12px;
  color: var(--ink-muted);
}

/* Filter */
.filter-wrap {
  padding: 1rem 1.5rem 0.75rem;
  background: var(--cream);
  position: sticky;
  top: 56px;
  z-index: 40;
  border-bottom: 1px solid var(--border);
}

.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--ink-soft);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.filter-btn:hover {
  border-color: var(--ink-soft);
  color: var(--ink);
}

.filter-btn.active {
  background: var(--ink);
  color: var(--cream);
  border-color: var(--ink);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Grid */
.grid-wrap { padding: 1.25rem 1.5rem 3rem; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

/* Card */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(28,26,23,0.1);
}

.card-img {
  height: 170px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  position: relative;
}

.bottle-icon {
  font-size: 64px;
  line-height: 1;
  user-select: none;
}

.type-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 9px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.card-body { padding: 10px 12px 12px; }

.card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 2px;
}

.card-producer {
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 8px;
}

.card-meta {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.meta-tag {
  font-size: 10px;
  background: var(--cream-dark);
  color: var(--ink-soft);
  padding: 2px 6px;
  border-radius: 3px;
}


.card-region {
  font-size: 10px;
  color: var(--ink-muted);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}
.card-region::before {
  content: '📍';
  font-size: 9px;
}
.card-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  color: var(--ink);
}

.currency { font-size: 13px; }

/* Color themes */
.bg-red { background: linear-gradient(180deg, #F9EDEB 0%, #F0DDD9 100%); }
.bg-white { background: linear-gradient(180deg, #FAF7EC 0%, #EDE5C8 100%); }
.bg-orange { background: linear-gradient(180deg, #FBF2E0 0%, #F2E2C0 100%); }
.bg-sparkling { background: linear-gradient(180deg, #EBF3E4 0%, #D6E9CB 100%); }

.badge-red { background: var(--red-light); color: var(--red); }
.badge-white { background: var(--white-wine-light); color: #5A4E10; }
.badge-orange { background: var(--orange-wine-light); color: #7A4A10; }
.badge-sparkling { background: var(--sparkling-light); color: var(--sparkling); }
.badge-petnat { background: var(--sparkling-light); color: var(--sparkling); }

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(28,26,23,0.55);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}

@media (min-width: 600px) {
  .overlay { align-items: center; padding: 1rem; }
}

.overlay.open { display: flex; }

.modal {
  background: #fff;
  width: 100%;
  max-width: 420px;
  border-radius: var(--radius) var(--radius) 0 0;
  overflow: hidden;
  animation: slideUp 0.25s ease;
  max-height: 90vh;
  overflow-y: auto;
}

@media (min-width: 600px) {
  .modal { border-radius: var(--radius); }
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  height: 200px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  border: none;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
}

.modal-bottle { font-size: 90px; line-height: 1; }

.modal-body { padding: 1.25rem 1.5rem 2rem; }

.modal-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.modal-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 2px;
}

.modal-producer {
  font-size: 13px;
  color: var(--ink-muted);
  margin-bottom: 14px;
}

.modal-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.modal-tag {
  font-size: 11px;
  background: var(--cream);
  border: 1px solid var(--border);
  color: var(--ink-soft);
  padding: 3px 8px;
  border-radius: 4px;
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 14px 0;
}

.modal-desc {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 12px;
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
}

.modal-grape {
  font-size: 12px;
  color: var(--ink-muted);
  margin-bottom: 16px;
}

.modal-price-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.modal-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  color: var(--ink);
}

.price-label {
  font-size: 11px;
  color: var(--ink-muted);
}

/* Empty state */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 1rem;
  color: var(--ink-muted);
}

.empty-icon { font-size: 40px; margin-bottom: 0.75rem; }

/* Responsive */
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-wrap { padding: 1rem 1rem 3rem; }
  header, .filter-wrap { padding-left: 1rem; padding-right: 1rem; }
}

/* Search in header */
.header-right { display: flex; align-items: center; gap: 10px; }
.search-box-header {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 11px;
  width: 160px;
  transition: width 0.2s;
}
.search-box-header:focus-within { width: 200px; border-color: var(--ink-soft); }
.search-icon-sm { font-size: 12px; flex-shrink: 0; }
#search-input {
  flex: 1;
  border: none;
  outline: none;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--ink);
  background: transparent;
  min-width: 0;
}
#search-input::placeholder { color: var(--ink-muted); }
.search-clear {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink-muted);
  font-size: 12px;
  padding: 0;
  line-height: 1;
}
.search-clear:hover { color: var(--ink); }
@media (max-width: 480px) {
  .search-box-header { width: 120px; }
  .search-box-header:focus-within { width: 150px; }
}
</style>
</head>

const EMOJI = { red: "🍷", white: "🥂", orange: "🍊", sparkling: "✨", petnat: "🫧" };
const BG = { red: "bg-red", white: "bg-white", orange: "bg-orange", sparkling: "bg-sparkling", petnat: "bg-sparkling" };
const BADGE = { red: "badge-red", white: "badge-white", orange: "badge-orange", sparkling: "badge-sparkling", petnat: "badge-petnat" };

let activeType = "all";

function renderGrid(type) {
  const grid = document.getElementById("grid");
  let list = type === "all" ? wines : wines.filter(w => w.type === type);
  if (searchQuery) {
    list = list.filter(w =>
      w.name.toLowerCase().includes(searchQuery) ||
      w.producer.toLowerCase().includes(searchQuery) ||
      (w.grapes && w.grapes.toLowerCase().includes(searchQuery)) ||
      (w.region && w.region.toLowerCase().includes(searchQuery))
    );
  }
  document.getElementById("count").textContent = list.length + " wines";
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🍾</div><p>No wines in this category</p></div>';
    return;
  }
  grid.innerHTML = list.map(w => {
    const idx = wines.indexOf(w);
    return `
      <div class="card" onclick="openModal(${idx})" role="button" tabindex="0" aria-label="${w.name}">
        <div class="card-img ${BG[w.type]}">
          <span class="type-badge ${BADGE[w.type]}">${w.type}</span>
          <span class="bottle-icon" aria-hidden="true">${EMOJI[w.type]}</span>
        </div>
        <div class="card-body">
          <div class="card-name">${w.name}</div>
          <div class="card-producer">${w.producer}</div>
          ${w.region ? `<div class="card-region">${w.region}</div>` : ''}
          <div class="card-meta">
            <span class="meta-tag">${w.year}</span>
            ${w.grapes ? '<span class="meta-tag">' + w.grapes.split(',')[0] + '</span>' : ''}
          </div>
          <div class="card-price">${w.price ? '<span class="currency">฿</span>' + w.price.toLocaleString() : '<span style=\'color:var(--ink-muted);font-size:13px\'>—</span>'}</div>
        </div>
      </div>`;
  }).join("");
}

function openModal(i) {
  const w = wines[i];
  const hdr = document.getElementById("m-header");
  hdr.className = "modal-header " + BG[w.type];
  document.getElementById("m-bottle").textContent = EMOJI[w.type];
  const badge = document.getElementById("m-badge");
  badge.textContent = w.type;
  badge.className = "modal-badge " + BADGE[w.type];
  document.getElementById("m-name").textContent = w.name;
  document.getElementById("m-producer").textContent = w.producer;
  const tags = [w.year, w.size, w.region].filter(Boolean);
  document.getElementById("m-tags").innerHTML = tags.map(t => `<span class="modal-tag">${t}</span>`).join("");
  const grapeEl = document.getElementById("m-grape");
  grapeEl.textContent = w.grapes ? "🍇 " + w.grapes : "";
  grapeEl.style.display = w.grapes ? "" : "none";
  const descEl = document.getElementById("m-desc");
  descEl.style.display = "none";
  document.getElementById("m-price").textContent = w.price ? "฿" + w.price.toLocaleString() : "ราคาสอบถามเพิ่มเติม";
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modal-close").onclick = closeModal;
document.getElementById("overlay").onclick = e => { if (e.target === document.getElementById("overlay")) closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  activeType = btn.dataset.type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
  renderGrid(activeType);
});

// Search
let searchQuery = "";
const searchInput = document.getElementById("search-input");
const searchClear = document.getElementById("search-clear");

searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value.toLowerCase();
  searchClear.style.display = searchQuery ? "" : "none";
  renderGrid(activeType);
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchQuery = "";
  searchClear.style.display = "none";
  renderGrid(activeType);
});

renderGrid("all");
</script>
